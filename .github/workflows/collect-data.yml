name: Collect Deye Solar Telemetry

on:
  schedule:
    # Run every 30 minutes to stay well within GitHub Actions & DeyeCloud free limits
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'collector/requirements.txt'

      - name: Install collector dependencies
        run: pip install -r collector/requirements.txt

      - name: Run DeyeCloud collector
        env:
          DEYE_BASE_URL: ${{ secrets.DEYE_BASE_URL }}
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_DEVICE_SNS: ${{ secrets.DEYE_DEVICE_SNS }}
          DEYE_COMPANY_ID: ${{ secrets.DEYE_COMPANY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m collector.main
